                    type: array
                    items:
                      type: object

  /wiki/link:
    post:
      operationId: wiki.link
      summary: Create cross-reference between pages
      description: |
        Link wiki pages with relationship types: related, child, prerequisite.

        **Requirements:** FR-110
      tags:
        - Wiki Documentation
      security:
        - autonomyLevel: [1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromId, toId, linkType]
              properties:
                fromId:
                  type: integer
                toId:
                  type: integer
                linkType:
                  type: string
                  enum: [related, child, prerequisite]
      responses:
        '200':
          description: Link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkId:
                    type: integer

  # =============================================================================
  # PROJECT HEALTH TOOLS (4 tools) - FR-116 to FR-120
  # =============================================================================

  /health/scan:
    post:
      operationId: health.scan
      summary: Run automated health scanners
      description: |
        Run Semgrep, ESLint, Lighthouse, axe-core scanners.
        Returns categorized findings with severity levels.

        **Requirements:** FR-116
      tags:
        - Project Health
      security:
        - autonomyLevel: [1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scanners]
              properties:
                scanners:
                  type: array
                  items:
                    type: string
                    enum: [semgrep, eslint, lighthouse, axe-core]
                target:
                  type: string
                  description: File or folder to scan
                  default: 'entire project'
      responses:
        '200':
          description: Scan complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId:
                    type: integer
                  findings:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                          enum: [security, quality, performance, accessibility, debt]
                        severity:
                          type: string
                          enum: [critical, high, medium, low]
                        message:
                          type: string
                        file:
                          type: string
                        line:
                          type: integer
                  score:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: Overall health score

  /health/findings:
    get:
      operationId: health.findings
      summary: Query health findings with filters
      description: |
        Query findings by category, severity, status.

        **Requirements:** FR-117
      tags:
        - Project Health
      security:
        - autonomyLevel: [0]
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [security, quality, performance, accessibility, debt]
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, fixed, ignored]
      responses:
        '200':
          description: Findings list
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      type: object
                  aggregations:
                    type: object
                    properties:
                      categoryCounts:
                        type: object
                      severityCounts:
                        type: object

  /health/score:
    get:
      operationId: health.score
      summary: Calculate overall health score
      description: |
        Health score algorithm:
        - Security: 100 - (criticals × 20) - (highs × 5) - (mediums × 1)
        - Quality: Similar formula
        - Performance: Lighthouse score
        - Accessibility: axe-core score
        - Debt: (clean files / total files) × 100

        **Requirements:** FR-118
      tags:
        - Project Health
      security:
        - autonomyLevel: [0]
      parameters:
        - name: reportId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Health score
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
                    minimum: 0
                    maximum: 100
                  breakdown:
                    type: object
                    properties:
                      security:
                        type: integer
                      quality:
                        type: integer
                      performance:
                        type: integer
                      accessibility:
                        type: integer
                      debt:
                        type: integer

  /health/remediate:
    patch:
      operationId: health.remediate
      summary: Track remediation status
      description: |
        Mark finding as fixed or ignored with reason.

        **Requirements:** FR-119
      tags:
        - Project Health
      security:
        - autonomyLevel: [1]
      parameters:
        - name: findingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [fixed, ignored]
                reason:
                  type: string
      responses:
        '200':
          description: Remediation tracked
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: boolean

  # =============================================================================
  # AGENT PERSONAS TOOLS (4 tools) - FR-121 to FR-125
  # =============================================================================

  /personas/create:
    post:
      operationId: personas.create
      summary: Create agent persona
      description: |
        Create project-specific persona with system prompt, tools, autonomy level.

        **Requirements:** FR-121
      tags:
        - Agent Personas
      security:
        - autonomyLevel: [2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, systemPrompt, tools, triggers, autonomyLevel]
              properties:
                name:
                  type: string
                  example: 'API Debugger'
                systemPrompt:
                  type: string
                  description: System prompt for persona
                tools:
                  type: array
                  items:
                    type: string
                  description: MCP tools allowed for this persona
                triggers:
                  type: array
                  items:
                    type: string
                  description: Keywords that activate persona
                autonomyLevel:
                  type: integer
                  minimum: 0
                  maximum: 4
                  description: '0=read-only, 4=full autonomy'
      responses:
        '200':
          description: Persona created
          content:
            application/json:
              schema:
                type: object
                properties:
                  personaId:
                    type: integer

  /personas/list:
    get:
      operationId: personas.list
      summary: List available personas
      description: |
        List personas with optional active filter.

        **Requirements:** FR-122
      tags:
        - Agent Personas
      security:
        - autonomyLevel: [0]
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Personas list
          content:
            application/json:
              schema:
                type: object
                properties:
                  personas:
                    type: array
                    items:
                      type: object

  /personas/activate:
    post:
      operationId: personas.activate
      summary: Activate persona for session
      description: |
        Activate persona, returns system prompt and available tools.

        **Requirements:** FR-123
      tags:
        - Agent Personas
      security:
        - autonomyLevel: [1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personaId, sessionId]
              properties:
                personaId:
                  type: integer
                sessionId:
                  type: integer
      responses:
        '200':
          description: Persona activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  activationId:
                    type: integer
                  systemPrompt:
                    type: string
                  tools:
                    type: array
                    items:
                      type: string

  /personas/deactivate:
    post:
      operationId: personas.deactivate
      summary: Deactivate persona
      description: |
        Deactivate persona activation.

        **Requirements:** FR-124
      tags:
        - Agent Personas
      security:
        - autonomyLevel: [1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activationId]
              properties:
                activationId:
                  type: integer
      responses:
        '200':
          description: Persona deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  deactivated:
                    type: boolean

  # =============================================================================
  # DASHBOARD METRICS TOOLS (3 tools) - Cross-cutting
  # =============================================================================

  /dashboard/metrics:
    get:
      operationId: dashboard.metrics
      summary: Get dashboard metrics
      description: |
        Real-time metrics with 5-minute cache TTL.
        Progress, issues, health, velocity.

        **Requirements:** FR-125
      tags:
        - Dashboard Metrics
      security:
        - autonomyLevel: [0]
      parameters:
        - name: phaseId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  progress:
                    type: object
                    properties:
                      phase:
                        type: integer
                      currentWeek:
                        type: integer
                      currentDay:
                        type: integer
                  issues:
                    type: object
                    properties:
                      open:
                        type: integer
                      inProgress:
                        type: integer
                      review:
                        type: integer
                      closed:
                        type: integer
                  health:
                    type: object
                    properties:
                      score:
                        type: integer
                      security:
                        type: integer
                      quality:
                        type: integer
                  velocity:
                    type: object
                    properties:
                      tasksPerDay:
                        type: number
                      tokenEfficiency:
                        type: integer

  /dashboard/timeline:
    get:
      operationId: dashboard.timeline
      summary: Get activity timeline
      description: |
        Activity timeline with event types: task, issue, knowledge, health.

        **Requirements:** FR-125
      tags:
        - Dashboard Metrics
      security:
        - autonomyLevel: [0]
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Timeline events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                        type:
                          type: string
                          enum: [task, issue, knowledge, health]
                        action:
                          type: string
                        details:
                          type: object

  /dashboard/burndown:
    get:
      operationId: dashboard.burndown
      summary: Get burndown chart data
      description: |
        Burndown chart: ideal vs actual remaining work.

        **Requirements:** FR-125
      tags:
        - Dashboard Metrics
      security:
        - autonomyLevel: [0]
      parameters:
        - name: phaseId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Burndown data
          content:
            application/json:
              schema:
                type: object
                properties:
                  ideal:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: integer
                        remaining:
                          type: number
                  actual:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: integer
                        remaining:
                          type: number
