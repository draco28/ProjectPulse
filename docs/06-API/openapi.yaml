        Update wiki page content, creates new version for history.

        **Requirements:** FR-108
      tags:
        - Wiki Documentation
      security:
        - autonomyLevel: [1]
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, reason]
              properties:
                content:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Wiki page updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  versionId:
                    type: integer

  /wiki/query:
    get:
