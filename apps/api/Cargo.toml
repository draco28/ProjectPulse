[package]
name = "projectpulse-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "projectpulse-api"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
# Crate exports as `pulsedb` (import as `use pulsedb::...`)
pulsehive-db = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
sha2 = "0.10"
futures = "0.3"
# PulseHive agent orchestration (Sprint 5)
pulsehive = { workspace = true }
pulsehive-core = { workspace = true }
pulsehive-runtime = { workspace = true }
pulsehive-openai = { workspace = true }

[dev-dependencies]
axum-test = "16"
tempfile = "3"
