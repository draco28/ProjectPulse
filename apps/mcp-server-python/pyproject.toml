[project]
name = "projectpulse-mcp-python"
version = "0.1.0"
description = "ProjectPulse MCP Server - Python Implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.7.1",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.38.0",
    "structlog>=24.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]
