name: CI/CD Pipeline

on:
  push:
    branches: [master, feature/*]
  pull_request:
    branches: [master]

jobs:
  # ============================================================================
  # JOB 1: Code Quality & Linting
  # ============================================================================
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter web lint

      - name: Run Prettier
        run: pnpm --filter web format:check

      - name: TypeScript type check
        run: pnpm --filter web type-check

  # ============================================================================
  # JOB 2: Unit & Integration Tests
  # ============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: projectpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_test
        run: |
          cd apps/web
          npx prisma migrate deploy
          npx prisma db seed

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_test
        run: pnpm --filter web test:unit

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_test
        run: pnpm --filter web test:integration

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/web/coverage/lcov.info

  # ============================================================================
  # JOB 3: E2E Tests
  # ============================================================================
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: projectpulse_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_e2e
        run: |
          cd apps/web
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build Next.js app
        run: pnpm --filter web build

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_e2e
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  # ============================================================================
  # JOB 4: Build & Security Scan
  # ============================================================================
  build:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm --filter web build

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Docker build test
        run: |
          cd apps/web
          docker build -t projectpulse:test .

  # ============================================================================
  # JOB 5: Deploy to Staging (on push to master)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.projectpulse.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment script here
          # Example: rsync, docker compose, kubectl, etc.

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          curl -f https://staging.projectpulse.dev/api/health || exit 1

  # ============================================================================
  # JOB 6: Deploy to Production (manual approval)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://projectpulse.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment script

      - name: Health check
        run: |
          echo "Running production health checks..."
          curl -f https://projectpulse.dev/api/health || exit 1

      - name: Notify deployment success
        run: |
          echo "Production deployment successful!"
          # Add Slack/Discord notification here
