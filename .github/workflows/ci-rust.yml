name: Rust CI Pipeline

# Triggers: Only when Rust-related files change
on:
  push:
    branches: ['**']
    paths:
      - 'apps/api/**'
      - 'apps/desktop/src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/desktop/src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # ==========================================================================
  # JOB 1: Code Quality (fmt + clippy)
  # ==========================================================================
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-quality-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-quality-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  # ==========================================================================
  # JOB 2: Tests (with PostgreSQL)
  # ==========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: projectpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-test-

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_test
          NEXTAUTH_SECRET: ci-test-secret-at-least-32-chars-long
        run: cargo test --workspace

  # ==========================================================================
  # JOB 3: Build Release
  # ==========================================================================
  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-build-

      - name: Build release binary
        run: cargo build --release -p projectpulse-api

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s target/release/projectpulse-api 2>/dev/null || stat -f%z target/release/projectpulse-api)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 200 ]; then
            echo "WARNING: Binary size exceeds 200MB"
          fi

  # ==========================================================================
  # JOB 4: Security Audit (advisory only)
  # ==========================================================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked 2>/dev/null || true
      - name: Run audit
        run: cargo deny check advisories 2>/dev/null || echo "cargo-deny not configured yet — skipping"
