name: CI Pipeline (Automated Testing)

# Triggers: Every push to any branch, every PR to master
on:
  push:
    branches: ['**']  # All branches
  pull_request:
    branches: [master]

jobs:
  # ============================================================================
  # JOB 1: Code Quality Checks
  # ============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @projectpulse/roadmap-tools build

      - name: Generate Prisma Client
        working-directory: apps/web
        run: npx prisma generate

      - name: Run ESLint
        run: pnpm --filter web lint

      - name: Check formatting
        run: pnpm --filter web format:check

      - name: TypeScript type check
        run: pnpm --filter web type-check

  # ============================================================================
  # JOB 2: Unit & Integration Tests
  # ============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      # PostgreSQL with pgvector extension for vector embeddings
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: projectpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @projectpulse/roadmap-tools build

      - name: Generate Prisma Client
        working-directory: apps/web
        run: npx prisma generate

      - name: Run database migrations
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_test
        run: npx prisma migrate deploy

      - name: Seed test database
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_test
        run: npx prisma db seed

      - name: Run unit tests
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_test
        run: pnpm test:unit

      - name: Run integration tests
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_test
        run: pnpm test:integration

  # ============================================================================
  # JOB 3: E2E Tests (Playwright)
  # ============================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      # PostgreSQL with pgvector extension for vector embeddings
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: projectpulse_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @projectpulse/roadmap-tools build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma Client
        working-directory: apps/web
        run: npx prisma generate

      - name: Run database migrations
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_e2e
        run: npx prisma migrate deploy

      - name: Seed E2E database
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_e2e
        run: npx tsx prisma/seed-e2e.ts

      - name: Build Next.js app
        working-directory: apps/web
        run: pnpm build

      - name: Run E2E tests
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/projectpulse_e2e
          CI: true
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  # ============================================================================
  # JOB 4: Build Check
  # ============================================================================
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, test]  # Only run if lint and test pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: apps/web
        run: npx prisma generate

      - name: Build Next.js app
        working-directory: apps/web
        run: pnpm build
        env:
          # Use dummy DATABASE_URL for build (not actually connecting)
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projectpulse

      - name: Run security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true  # Don't fail build on warnings

  # ============================================================================
  # JOB 5: Deployment Notification (Future)
  # ============================================================================
  deploy-ready:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, build]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deployment notification
        run: |
          echo "✅ All tests passed!"
          echo "📦 Build successful!"
          echo "🚀 Ready to deploy to Mac mini"
          echo ""
          echo "To deploy manually:"
          echo "1. SSH to Mac mini: ssh draco@192.168.1.15"
          echo "2. Pull latest: cd ~/ProjectPulse && git pull origin master"
          echo "3. Restart services: docker-compose -f docker-compose.cloud.yml restart"

