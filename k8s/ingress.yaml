apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: projectpulse-ingress
  namespace: projectpulse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - projectpulse.example.com
    - api.projectpulse.example.com
    secretName: projectpulse-tls
  rules:
  - host: projectpulse.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nextjs
            port:
              number: 3000
  - host: api.projectpulse.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-server
            port:
              number: 3001
