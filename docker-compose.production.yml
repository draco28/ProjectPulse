version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: projectpulse-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-projectpulse_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projectpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: projectpulse-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    networks:
      - projectpulse
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nextjs:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.production
    image: projectpulse/web:latest
    container_name: projectpulse-nextjs-prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      DEFAULT_PROJECT_ID: ${DEFAULT_PROJECT_ID:-8}
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - projectpulse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile.production
    image: projectpulse/mcp-server:latest
    container_name: projectpulse-mcp-prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PROJECTPULSE_API_URL: http://nextjs:3000
      MCP_PORT: 3001
      NODE_ENV: production
    ports:
      - "${MCP_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nextjs:
        condition: service_started
    networks:
      - projectpulse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  projectpulse:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
