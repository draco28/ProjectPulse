version: '3.8'

services:
  # PostgreSQL Database (like Supabase) - with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: projectpulse-postgres-cloud
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: projectpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projectpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache (for rate limiting and sessions)
  # Note: Password enabled to match production environment and catch auth bugs early
  redis:
    image: redis:7-alpine
    container_name: projectpulse-redis-cloud
    command: redis-server --requirepass devredis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - projectpulse
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devredis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Next.js Frontend (like Vercel)
  nextjs:
    image: node:20-bullseye-slim
    container_name: projectpulse-nextjs-cloud
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && cd apps/web && pnpm prisma generate && pnpm prisma migrate deploy && pnpm dev --hostname 0.0.0.0"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/projectpulse_dev
      - NEXT_PUBLIC_API_URL=http://0.0.0.0:3000
      - NODE_ENV=development
      - DEFAULT_PROJECT_ID=3
      # Redis with password to match prod environment
      - REDIS_URL=redis://:devredis123@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - NEXTAUTH_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - nextjs_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - next_cache:/app/apps/web/.next
    networks:
      - projectpulse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # MCP Server (Custom Backend - Streamable HTTP for Production)
  # Production: Streamable HTTP transport (March 2025 spec, replaces deprecated SSE)
  # Development: stdio transport for local Claude Code
  # Architecture: AI agents connect via HTTP POST to /mcp endpoint with OAuth/API keys
  mcp-server:
    image: node:20-bullseye-slim
    container_name: projectpulse-mcp-cloud
    working_dir: /app
    # Run HTTP transport server for production
    # pnpm workspace symlinks work correctly without volume shadowing
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --no-frozen-lockfile --prod=false && cd apps/web && npx prisma@5.22.0 generate && cd /app/apps/mcp-server && pnpm build && node dist/index-http.js || tail -f /dev/null"
    environment:
      - PROJECTPULSE_API_URL=http://nextjs:3000
      - NODE_ENV=production
      - MCP_PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/projectpulse_dev
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
      # NOTE: No separate volume for mcp-server/node_modules
      # pnpm workspaces use symlinks to root store - volume would shadow them
    networks:
      - projectpulse
    depends_on:
      - nextjs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  projectpulse:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nextjs_node_modules:
  web_node_modules:
  # mcp_node_modules removed - pnpm workspace symlinks don't work with separate volumes
  next_cache:
